server {
    listen 80;
    listen [::]:80;
    server_name manobank.2-27-40-156.sslip.io;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /srv/manobank/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://manobank.2-27-40-156.sslip.io$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name manobank.2-27-40-156.sslip.io;
    root /srv/manobank/site/public;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 2m;

    ssl_certificate /etc/letsencrypt/live/manobank.2-27-40-156.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manobank.2-27-40-156.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:manobank_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/manobank-access.log;
    error_log /var/log/nginx/manobank-error.log;

    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /build/ {
        try_files $uri =404;
        expires 7d;
    }

    location = /index.php {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/manobank85.sock;
        fastcgi_read_timeout 120s;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php(?:/|$) {
        return 404;
    }

    location ~ /\. {
        return 404;
    }
}
