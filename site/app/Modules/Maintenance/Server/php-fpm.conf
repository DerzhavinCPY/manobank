[manobank]
user = manobank
group = manobank
listen = /run/php/manobank85.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 15s
pm.max_requests = 500
request_terminate_timeout = 120s
catch_workers_output = yes
clear_env = yes
security.limit_extensions = .php
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 90
php_admin_value[date.timezone] = Europe/Samara
php_admin_value[sys_temp_dir] = /srv/manobank/temp/runtime/php
php_admin_value[upload_tmp_dir] = /srv/manobank/temp/runtime/php
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /srv/manobank/site/storage/logs/php-error.log
php_admin_flag[display_errors] = off
